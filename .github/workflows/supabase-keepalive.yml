# Supabase pausiert Free-Projekte nach ~7 Tagen ohne Aktivität.
# Diese Abfrage alle 3 Tage hält das Projekt wach.
# Benötigt Repo-Secrets: SUPABASE_URL, SUPABASE_ANON_KEY
name: Supabase Keep-alive

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Supabase abfragen
        run: |
          curl --fail --silent --show-error \
            "${{ secrets.SUPABASE_URL }}/rest/v1/books?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
